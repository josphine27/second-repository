<!DOCTYPE html>
<html>
<head>
    <title>ordered list</title>
    </head>
    <body>
        <h1>this is a typical list</h1>
        <ol type="A">
            <li>first</li>
            <li>second</li>
            <li>third</li>
            <li>forth</li>
            <li>and so on</li>
        </ol>
        <h2>The list is starting from 5</h2>
        <ol start="5">
            <li>ice cream</li>
            <li>mango</li>
            <li>juice</li>
            <li>popcorn</li>                
            <li>and so on</li>
        </ol>
    </body>
</html>
